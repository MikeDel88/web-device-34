name: CI olympic-games
run-name: CI olympic-games by @${{ github.actor }}

on:
  push:
    branches: [main, develop, ci]
    paths:
      - "olympic-games/**"
      - "run-tests.py"
      - ".github/workflows/ci-olympic-games.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "olympic-games/**"
      - "run-tests.py"
      - ".github/workflows/ci-olympic-games.yml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: write
  id-token: write
  attestations: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      project: olympic-games
      type: angular
